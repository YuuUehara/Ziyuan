[workspace]
members = [
    "crates/ziyuan-core",
    "crates/ziyuan-governance",
    "crates/ziyuan-runtime",
    "crates/ziyuan-llm",
    "crates/ziyuan-github",
    "crates/ziyuan-storage",
    "crates/ziyuan-app",
    "crates/ziyuan-web",
    "crates/ziyuan-tui",
    "crates/ziyuan-cli",
]
resolver = "3"

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ziyuan-core = { path = "crates/ziyuan-core" }
ziyuan-governance = { path = "crates/ziyuan-governance" }
ziyuan-runtime = { path = "crates/ziyuan-runtime" }
ziyuan-llm = { path = "crates/ziyuan-llm" }
ziyuan-github = { path = "crates/ziyuan-github" }
ziyuan-storage = { path = "crates/ziyuan-storage" }
ziyuan-app = { path = "crates/ziyuan-app" }
ziyuan-web = { path = "crates/ziyuan-web" }
ziyuan-tui = { path = "crates/ziyuan-tui" }
axum = "0.8"
ratatui = "0.30"
futures-util = { version = "0.3", default-features = false }
# 会典（快照）：朝廷状态的序列化。
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# 已随 ureq（rustls）进入依赖树；ChatGPT 登录用它取随机数、算 SHA-256、验 ID token 签名。
ring = "0.17"
ureq = "3"
tokio = "1"
# 改动预览：词级差异与按语言着色（纯 Rust 正则，不依赖 oniguruma）。
similar = "3"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[workspace.lints.rust]
unsafe_code = "forbid"
