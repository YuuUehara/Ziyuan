[workspace]
members = [
    "crates/ziyuan-core",
    "crates/ziyuan-governance",
    "crates/ziyuan-runtime",
    "crates/ziyuan-llm",
    "crates/ziyuan-github",
    "crates/ziyuan-storage",
    "crates/ziyuan-app",
    "crates/ziyuan-web",
    "crates/ziyuan-tui",
    "crates/ziyuan-cli",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ziyuan-core = { path = "crates/ziyuan-core" }
ziyuan-governance = { path = "crates/ziyuan-governance" }
ziyuan-runtime = { path = "crates/ziyuan-runtime" }
ziyuan-llm = { path = "crates/ziyuan-llm" }
ziyuan-github = { path = "crates/ziyuan-github" }
ziyuan-storage = { path = "crates/ziyuan-storage" }
ziyuan-app = { path = "crates/ziyuan-app" }
ziyuan-web = { path = "crates/ziyuan-web" }
ziyuan-tui = { path = "crates/ziyuan-tui" }
axum = "0.8"
ratatui = "0.30"
futures-util = { version = "0.3", default-features = false }
serde_json = "1"
ureq = "3"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
