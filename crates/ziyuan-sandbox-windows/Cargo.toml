[package]
name = "ziyuan-sandbox-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Experimental native Windows startup probes; not a production sandbox"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

# Only the private Win32 ownership boundary may opt in. Other workspace crates
# continue inheriting unsafe_code = "forbid"; this crate is not published/linked.
[lints.rust]
unsafe_code = "deny"
