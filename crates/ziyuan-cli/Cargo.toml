[package]
name = "ziyuan-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "紫垣 ZiYuan：用中国古代朝廷角色组织多智能体协作的命令行工具，改动须用户审阅批准才写入文件。"
repository.workspace = true
readme = "../../README.md"
keywords = ["agent", "llm", "multi-agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ziyuan"
path = "src/main.rs"

[dependencies]
ziyuan-app.workspace = true
ziyuan-core.workspace = true
ziyuan-governance.workspace = true
ziyuan-github.workspace = true
ziyuan-llm.workspace = true
ziyuan-runtime.workspace = true
ziyuan-storage.workspace = true
ziyuan-web.workspace = true
ziyuan-tui.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }

[lints]
workspace = true
