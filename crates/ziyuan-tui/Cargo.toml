[package]
name = "ziyuan-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "终端界面：紫垣（ZiYuan）的内部组件，供 ziyuan-cli 使用；Rust API 不保证稳定。"
repository.workspace = true

[dependencies]
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
ziyuan-app.workspace = true
ziyuan-core.workspace = true
ziyuan-governance.workspace = true
ziyuan-runtime.workspace = true
ziyuan-storage.workspace = true

[dev-dependencies]
# 已随 ratatui 进入依赖树；测试用它判断宽度有歧义的字符。
unicode-width = "0.2"
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
