name: Release

# 推送 v* 标签（如 v0.5.0）时，建 GitHub Release 并附各平台预编译的 ziyuan。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 标签须与 Cargo.toml 的版本一致
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 Cargo.toml 的版本 $version 不符" >&2
            exit 1
          fi
      - name: 建草稿 Release（全部包验收后才公开）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 带连字符的版本（如 1.0.0-rc.1）是预发布，不标为 latest。
          pre=""
          case "$version" in *-*) pre="--prerelease" ;; esac
          # 节标题须恰为「## 版本」（或其后跟空格），1.0.0 不会误收 1.0.0-rc.1 一节。
          if [ -f CHANGELOG.md ] && grep -qE "^## $version( |$)" CHANGELOG.md; then
            awk -v v="## $version" '$0 ~ "^## " { on = ($0 == v || index($0, v " ") == 1); if (!on && seen) exit; seen = seen || on; next } on' CHANGELOG.md > notes.md
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag $pre --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag $pre --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p ziyuan-cli --target ${{ matrix.target }}
      - name: 检查 Linux GNU glibc 2.35 基线与启动
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash scripts/check-linux-compat.sh target/${{ matrix.target }}/release/ziyuan
      - name: 打包并上传
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="ziyuan-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/ziyuan.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/ziyuan" "$name/"
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          gh release upload "$GITHUB_REF_NAME" "$asset"
          # 验收实际上传的包，不只验收构建目录里的二进制。
          mkdir downloaded
          gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir downloaded
          cmp "$asset" "downloaded/$asset"
          if [ "${{ runner.os }}" = Windows ]; then
            7z x "downloaded/$asset" -odownloaded > /dev/null
            binary="$PWD/downloaded/$name/ziyuan.exe"
          else
            tar xzf "downloaded/$asset" -C downloaded
            binary="$PWD/downloaded/$name/ziyuan"
          fi
          bash scripts/check-package.sh "$binary" "${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-gnu ]; then
            bash scripts/check-linux-compat.sh "$binary"
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 所有平台下载包验收通过后发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest=true
          case "${GITHUB_REF_NAME#v}" in *-*) latest=false ;; esac
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest"
