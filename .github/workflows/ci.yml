name: CI

on:
  push:
    branches: [main, "work/**", "codex/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · 测试 · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: 文档链接与标题定位
        run: python3 scripts/check-doc-links.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 人工译稿标记逻辑与本地资料编辑/模型/预览的纯函数单测。
      # 用 Node 内置测试器，不引第三方依赖；浏览器侧同一份文件。
      - name: 前端标记逻辑单测
        run: |
          node --version
          node --test crates/ziyuan-web/src/*.test.mjs
      # 号舍：装 bubblewrap 与 socat（按域名放行），并放开 Ubuntu 对非特权用户命名空间的限制，号舍的测试才真跑。
      - run: |
          sudo apt-get install -y -q bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # smoke.sh 先跑 cargo test --workspace，再以演示后端走一遍 CLI。
      - run: bash scripts/smoke.sh
      - name: R0 离线字面量检索基线（合成材料，非产品索引）
        run: cargo run -p ziyuan-runtime --example code_search_baseline --locked

  linux-compat:
    name: Linux GNU · glibc 2.35 基线与启动
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo build --release --locked -p ziyuan-cli --target x86_64-unknown-linux-gnu
      - run: bash scripts/check-linux-compat.sh target/x86_64-unknown-linux-gnu/release/ziyuan
      - name: 离线包验收
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          bash scripts/check-package.sh target/x86_64-unknown-linux-gnu/release/ziyuan "$version"

  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  msrv:
    name: 最低 Rust 版本（1.89）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check -p ziyuan-sandbox-windows --all-targets --target x86_64-pc-windows-msvc --locked

  platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两者都跑全部测试，某个 crate 失败也跑完其余的。Windows 经原生 AppContainer＋Job 运行 run_tests，长连接 stdio 外藩仍 fail closed；符号链接相关的用例只在 Unix 上跑。
          - os: macos-latest
            name: macOS · 功能与号舍（Seatbelt）
            command: cargo test --workspace --locked --no-fail-fast
          - os: windows-2025
            name: Windows · 功能与原生号舍（AppContainer＋Job）
            command: cargo test --workspace --locked --no-fail-fast
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 号舍（Windows Server）：Windows Server 默认不对 AppContainer 开放 \Device\Null，
      # 按 Windows 11 桌面默认规则补齐 AC / S-1-15-2-2 / Low IL，使 git (/dev/null) 与 cmd >nul 在号舍内正常运行。
      - name: 准备 Windows Server \Device\Null 号舍权限
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: pwsh -NoProfile -File scripts/prepare-windows-null-device.ps1
      - run: ${{ matrix.command }}
      - name: R0 离线字面量检索基线（合成材料，非产品索引）
        run: cargo run -p ziyuan-runtime --example code_search_baseline --locked
      - name: W1–W2 Windows 原生号舍隔离探针与真实工具链验收
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
          Write-Output "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          cargo test -p ziyuan-sandbox-windows --locked --test startup -- --nocapture
      - name: 原生平台离线包验收
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          binary=target/debug/ziyuan
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          bash scripts/check-package.sh "$binary" "$version"
