name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · 测试 · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 号舍：装 bubblewrap 与 socat（按域名放行），并放开 Ubuntu 对非特权用户命名空间的限制，号舍的测试才真跑。
      - run: |
          sudo apt-get install -y -q bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # smoke.sh 先跑 cargo test --workspace，再以演示后端走一遍 CLI。
      - run: bash scripts/smoke.sh

  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  msrv:
    name: 最低 Rust 版本（1.89）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  platforms:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两者都跑全部测试，某个 crate 失败也跑完其余的。Windows 无号舍：run_tests 用例先断言拒绝，再以 off 经 cmd /C 核对副本；符号链接相关的用例只在 Unix 上跑。
          - os: macos-latest
            command: cargo test --workspace --locked --no-fail-fast
          - os: windows-latest
            command: cargo test --workspace --locked --no-fail-fast
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ${{ matrix.command }}
